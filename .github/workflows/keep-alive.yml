name: Supabase Keep Alive

on:
   schedule:
      - cron: '0 0 */1 * *'
   workflow_dispatch: # Allows manual triggering via GitHub Actions interface

jobs:
   ping:
      runs-on: ubuntu-latest
      steps:
         - name: Send request to Supabase API
           run: |
              curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/services?select=id&limit=1" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
